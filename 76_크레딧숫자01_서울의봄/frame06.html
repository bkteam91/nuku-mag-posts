<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=block"><style>:root{--bg:#0F1115;--ink:#ECEDF1;--muted:#7E8492;--soft:#C2C7D1;--line:#252A33;--card:#181B22;--cardbd:#2A303B;--accent:#4AA0FF;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;word-break:keep-all;line-break:strict;}
.frame{position:relative;width:1080px;height:1920px;overflow:hidden;
  padding:140px 96px 130px;display:flex;flex-direction:column;}
em{font-style:normal;color:var(--accent);}
u{text-decoration:none;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--accent) 32%,transparent) 0);}
.top{display:flex;justify-content:space-between;align-items:center;
  font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--muted);}
.top .num{font-variant-numeric:tabular-nums;}
.bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  font-size:32px;font-weight:800;color:var(--soft);}
.dot{width:15px;height:15px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:14px;}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;}

/* hook */
.kick{display:inline-block;align-self:flex-start;font-size:32px;font-weight:800;color:#fff;
  background:var(--accent);border-radius:14px;padding:14px 26px;letter-spacing:.02em;margin-bottom:46px;}
.hookh{font-weight:800;font-size:128px;line-height:1.16;letter-spacing:-.03em;width:100%;}
.hooksub{font-size:42px;line-height:1.55;color:var(--soft);font-weight:600;margin-top:50px;}

/* statement */
.h1{font-weight:800;font-size:100px;line-height:1.22;letter-spacing:-.025em;}
.h2{font-weight:800;font-size:78px;line-height:1.26;letter-spacing:-.02em;}
.sub{font-size:46px;line-height:1.55;color:var(--soft);font-weight:600;margin-top:44px;}

/* line (위험멘트) */
.lnum{font-size:40px;font-weight:800;color:var(--accent);letter-spacing:.06em;margin-bottom:34px;}
.quote{position:relative;background:var(--card);border:2px solid var(--cardbd);border-radius:30px;
  padding:56px 54px;}
.quote .qm{position:absolute;top:-46px;left:40px;font-size:140px;font-weight:800;color:var(--accent);line-height:1;}
.quote .qt{font-size:66px;font-weight:800;line-height:1.32;letter-spacing:-.02em;}
.mean{margin-top:48px;}
.mean .ml{font-size:32px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:18px;}
.mean .mt{font-size:46px;font-weight:600;line-height:1.5;color:var(--soft);}

/* cta */
.ctah{font-weight:800;font-size:90px;line-height:1.22;letter-spacing:-.025em;}
.ctasub{font-size:46px;line-height:1.55;color:var(--soft);font-weight:600;margin-top:40px;}
.ctabox{align-self:flex-start;margin-top:56px;background:var(--accent);border-radius:22px;
  padding:34px 46px;font-size:48px;font-weight:800;color:#fff;}
.handlebig{font-size:56px;font-weight:800;color:var(--ink);margin-top:64px;}
.handlebig .dot{width:20px;height:20px;}

/* myth (통념 깨기) */
.mythtag{font-size:38px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:40px;}
.myth-wrong{display:inline-block;font-size:72px;font-weight:800;line-height:1.3;
  color:var(--muted);letter-spacing:-.02em;
  text-decoration:line-through;text-decoration-color:#FF5A5A;text-decoration-thickness:8px;}
.myth-arrow{font-size:40px;font-weight:800;color:var(--accent);margin:48px 0 30px;}
.myth-right{font-size:80px;font-weight:800;line-height:1.26;letter-spacing:-.025em;}

/* big (큰 숫자/단어) */
.biglabel{display:inline-block;align-self:flex-start;font-size:34px;font-weight:800;color:var(--accent);
  letter-spacing:.04em;margin-bottom:24px;}
.bignum{font-size:200px;font-weight:800;color:var(--accent);line-height:.92;letter-spacing:-.05em;margin-bottom:34px;}
.bigcap{font-size:42px;line-height:1.5;color:var(--soft);font-weight:600;margin-top:38px;}

/* steps (확인 단계) */
.steps{margin-top:48px;}
.step{display:flex;gap:34px;position:relative;padding-bottom:50px;}
.step:last-child{padding-bottom:0;}
.step .sc{flex:none;width:78px;height:78px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;z-index:1;}
.step .ln{position:absolute;left:38px;top:74px;bottom:-8px;width:4px;background:var(--cardbd);}
.step:last-child .ln{display:none;}
.step .st{flex:1;padding-top:8px;}
.step .sh{font-size:50px;font-weight:800;line-height:1.26;letter-spacing:-.02em;}
.step .sd{font-size:34px;color:var(--soft);line-height:1.45;margin-top:12px;font-weight:600;}

/* disclaimer */
.disc{font-size:30px;line-height:1.55;color:var(--muted);font-weight:600;
  border-top:2px solid var(--line);padding-top:34px;margin-top:10px;}

/* ── 이미지 훅 (full) : 사진 전면 + 글자 ─────────────────────────────
   글자 블록은 하단 여백 330px로 밀어 넣어 프로필 그리드 4:5 크롭(285~1635px) 안에 들어온다. */
.frame.imghook{padding:0;background:#0A0C10;color:#fff;}
/* imgzoom = 확대배율, imgshift = 세로 이동(음수면 사진이 위로 = 피사체가 올라옴).
   소스가 9:16보다 가로로 넓으면 높이 기준으로 꽉 차서 imgpos 세로값이 안 먹는다.
   그때 피사체를 올리려면 imgzoom으로 여유를 만들고 imgshift로 밀어야 한다. */
.imghook .bgimg{position:absolute;top:50%;left:50%;
  width:calc(100% * var(--imgzoom,1));height:calc(100% * var(--imgzoom,1));
  transform:translate(-50%,-50%) translateY(var(--imgshift,0px));
  object-fit:cover;object-position:var(--imgpos,center 26%);}
.imghook .scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,10,14,.55) 0%,rgba(8,10,14,.08) 22%,
                  rgba(8,10,14,.50) 52%,rgba(8,10,14,.94) 86%,rgba(8,10,14,.98) 100%);}
.imghook .inner{position:relative;width:100%;height:100%;padding:140px 96px 330px;
  display:flex;flex-direction:column;text-shadow:0 6px 34px rgba(0,0,0,.5);}
.imghook .hbody{margin-top:auto;}
.imghook .hookh{color:#fff;}
.imghook .hooksub{color:rgba(255,255,255,.92);}
.imghook .bot{margin-top:56px;color:rgba(255,255,255,.92);}
.imghook .dot{background:#fff;}
.imghook em{color:#8CC2FF;}
.imghook u{background:linear-gradient(transparent 60%,rgba(2,115,255,.62) 0);}
.imghook .kick{text-shadow:none;}
/* 블루+고양이 표지 (2026-10-06) */
.kickrow{display:flex;align-items:flex-end;justify-content:space-between;width:100%;margin-bottom:46px;}
.kickrow .kick{margin-bottom:0;align-self:flex-end;}
.kickcat{height:118px;margin-bottom:-2px;}
.kickcat-ol{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff);}
.hscript{font-family:'Caveat',cursive;font-weight:600;font-size:64px;color:#fff;margin-top:6px;line-height:1;}
.hrule{height:3px;background:rgba(255,255,255,.85);margin-top:22px;}
.hscript+.hrule+.hooksub{margin-top:26px;}
.bluehook{background:#0273FF !important;}
.bluehook .scrim{background:linear-gradient(180deg,rgba(2,115,255,0) 0%,rgba(2,115,255,0) 44%,
  rgba(2,115,255,.86) 62%,#0273FF 74%,#0273FF 100%) !important;}
.bluehook .inner{text-shadow:none;}
.bluehook .kick{background:#0A0C10;color:#fff;}
.bluehook em{color:#fff;background:#0A0C10;padding:0 .14em;border-radius:6px;font-style:normal;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;}
.bluehook .hooksub{color:#fff;}
/* 커버 상단 중앙 한 줄(topnote). 프로필 그리드 4:5 크롭(285~1635) 안쪽인 300px에 둔다.
   더 위로 올리면 그리드 썸네일에서 잘린다. 크기는 hooksub(42px)와 동일. */
.topnote{position:absolute;left:96px;right:96px;top:var(--notetop,300px);text-align:center;
  font-size:var(--notesize,68px);font-weight:800;line-height:1.3;letter-spacing:.01em;
  color:var(--notecolor,#111);text-shadow:none;}
/* ── 이미지 훅 (split) : 위 사진 / 아래 글자 ─────────────────────── */
.frame.splithook{padding:0;}
.splithook .ph{position:relative;height:var(--imgh,48%);flex:none;overflow:hidden;}
.splithook .ph img{width:100%;height:100%;object-fit:cover;object-position:var(--imgpos,center 26%);}
/* 글자는 사진 바로 아래에서 아래로 자란다(flex-start). 가운데 정렬로 두면 글이 많을 때
   위로 넘쳐 사진을 침범한다(폭염짤 커버에서 발생). 넘칠 땐 아래 여백으로만 밀리게. */
.splithook .inner{flex:1;padding:80px 96px 360px;display:flex;flex-direction:column;
  justify-content:flex-start;min-height:0;}
.splithook .hbody{margin-top:0;}
.splithook .bot{margin-top:64px;}


/* ── 이미지 훅 (fade, 2026-10-02 드롭샷형) ─────────────────────────────
   사진과 글자 패널 사이에 경계선을 두지 않는다. 사진 아래쪽이 배경색으로 녹아들고
   글자는 그 녹는 구간 위에 걸친다. 글자·로고는 그리드 4:5 크롭(285~1635) 안쪽. */
.frame.fadehook{padding:0;}
.fadehook .ph{position:absolute;left:0;right:0;top:0;height:var(--imgh,66%);overflow:hidden;}
.fadehook .ph img{width:100%;height:100%;object-fit:cover;object-position:var(--imgpos,center 26%);
  filter:contrast(1.08) saturate(1.18);}
.fadehook .ph::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(20,21,43,0) 45%,rgba(20,21,43,.55) 70%,var(--bg) 100%);}
.fadehook .inner{position:absolute;left:0;right:0;bottom:0;padding:0 84px 300px;
  display:flex;flex-direction:column;}
.fadehook .hookh{color:#fff;line-height:1.22;letter-spacing:-.035em;text-shadow:0 4px 30px rgba(0,0,0,.45);}
.fadehook em{color:var(--em,var(--accent));}
.fadehook .brand{margin-top:52px;height:50px;display:block;opacity:.95;}
.fadehook .brand img{height:100%;width:auto;display:block;}


/* ── 사진 슬라이드 (statement/big/table/cta + "img", 2026-10-02 드롭샷형) ─────────
   글자만 있는 장은 PPT처럼 보인다. 위 사진(아래로 배경색에 녹음) + 아래 큰 글자. */
.frame.photoslide{padding:0;}
.photoslide .ph{position:absolute;left:0;right:0;top:0;height:var(--imgh,50%);overflow:hidden;}
.photoslide .ph img{width:100%;height:100%;object-fit:cover;object-position:var(--imgpos,center 40%);
  filter:contrast(1.06) saturate(1.15);}
.photoslide .ph::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 55%,var(--bg) 100%);}
.photoslide .top{position:absolute;left:96px;right:96px;top:72px;color:rgba(255,255,255,.95);z-index:2;}
.photoslide .body{position:absolute;left:0;right:0;top:calc(var(--imgh,50%) - 60px);bottom:0;
  padding:0 96px 120px;display:flex;flex-direction:column;justify-content:flex-start;}
.photoslide .h2{font-size:84px;line-height:1.24;letter-spacing:-.035em;}
.photoslide .sub{font-size:42px;margin-top:40px;}
.photoslide .disc{font-size:32px;}
.photoslide .bot{position:absolute;left:96px;right:96px;bottom:110px;}

/* ── big + 포스터 : 위 포스터 / 아래 관람료·제목 ─────────────────────
   공연 포스터는 비율이 제각각(2:3 ~ 1:1)이라 cover로 자르면 제목·날짜가 잘린다.
   같은 그림을 흐리게 깔고 원본은 contain으로 통째로 보여준다. */
.frame.bigposter{padding:0;}
.bigposter .ph{position:relative;height:var(--imgh,880px);flex:none;overflow:hidden;background:#0A0C10;}
.bigposter .ph .blur{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);
  height:calc(100% + 80px);object-fit:cover;filter:blur(38px) brightness(.55);}
.bigposter .ph .fg{position:relative;width:100%;height:100%;object-fit:contain;}
.bigposter .ph .topbar{position:absolute;left:96px;right:96px;top:56px;display:flex;
  justify-content:space-between;align-items:center;font-size:30px;font-weight:700;
  letter-spacing:.04em;color:rgba(255,255,255,.94);text-shadow:0 2px 14px rgba(0,0,0,.75);}
.bigposter .ph .topbar .num{font-variant-numeric:tabular-nums;}
.bigposter .inner{flex:1;padding:56px 96px 120px;display:flex;flex-direction:column;min-height:0;}
/* 포스터가 위를 먹으므로 글자는 한 단계씩 줄인다(글자만 있는 big보다 작다). */
.bigposter .bignum{font-size:150px;margin-bottom:22px;}
.bigposter .h2{font-size:60px;}
.bigposter .bigcap{font-size:37px;margin-top:26px;}
.bigposter .bot{margin-top:auto;}

/* ── 포스터 그리드 훅 : 위 2x2 포스터 / 아래 글자 (splithook 규칙을 그대로 쓴다) ── */
.gridhook .pg{height:var(--gridh,880px);flex:none;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;
  background:#0A0C10;padding:8px;overflow:hidden;}
/* 그리드 아이템 기본 min-height:auto 때문에 세로 포스터가 칸을 밀어 올려 아래줄이 잘린다.
   min-height:0으로 눌러야 1fr 1fr이 실제로 반반이 된다. */
.gridhook .pg .cell{position:relative;min-height:0;min-width:0;overflow:hidden;border-radius:10px;}
.gridhook .pg .cell .blur{position:absolute;left:-20px;top:-20px;width:calc(100% + 40px);
  height:calc(100% + 40px);object-fit:cover;filter:blur(22px) brightness(.5);}
/* 포스터는 잘라 쓰지 않는다 — 제목이 잘리면 무슨 공연인지 알아볼 수가 없다. */
.gridhook .pg .cell .fg{position:relative;width:100%;height:100%;object-fit:contain;}

/* show (공연 한 편) — 캐러셀 카드와 같은 구성: 장르 배지 / 제목 / 포스터 / 기간·장소·관람료.
   관람료를 bignum(200px)으로 키우면 가격 비교 콘텐츠처럼 읽힌다. 주인공은 포스터다. */
/* .body는 기본 min-height:auto라 내용이 많으면 프레임 밖으로 자란다(핸들이 잘렸다).
   포스터가 줄어들어 흡수하도록 body와 포스터 둘 다 min-height:0으로 눌러 둔다. */
.showslide .body{min-height:0;justify-content:flex-start;padding-top:26px;}
.showgenre{display:inline-block;align-self:flex-start;font-size:32px;font-weight:800;color:#fff;
  background:var(--accent);border-radius:14px;padding:14px 26px;letter-spacing:.02em;margin-bottom:30px;}
.showtitle{font-weight:800;letter-spacing:-.025em;line-height:1.2;width:100%;}
.showposter{flex:1;min-height:0;margin:44px 0 42px;display:flex;align-items:center;justify-content:center;}
/* 작은 원본은 화면을 채우되 --pmax(원본의 2.2배)까지만 키운다. 그 이상은 뭉개져서
   포스터를 넣은 의미가 없다. 큰 원본은 --pmax가 커서 사실상 100%로 찬다. */
.showposter img{width:auto;height:100%;max-width:100%;max-height:min(100%, var(--pmax,100%));
  object-fit:contain;border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.45);}
.showmeta{display:grid;grid-template-columns:auto 1fr;gap:18px 32px;align-items:baseline;}
.showmeta .k{font-size:33px;font-weight:800;color:var(--accent);white-space:nowrap;}
.showmeta .v{font-size:35px;font-weight:600;color:var(--soft);line-height:1.35;}
/* 핸들이 관람료 줄에 붙어 버린다 — 포스터가 flex:1이라 여백을 주면 포스터가 그만큼 줄어든다. */
.showslide .bot{margin-top:38px;}

/* table (비교표) */
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin-top:44px;
  border:2px solid var(--cardbd);border-radius:24px;overflow:hidden;}
.tbl th{background:var(--accent);color:#fff;font-size:33px;font-weight:800;
  padding:28px 26px;text-align:left;letter-spacing:-.01em;}
.tbl td{font-size:35px;font-weight:600;padding:30px 26px;border-top:2px solid var(--line);
  color:var(--soft);line-height:1.32;vertical-align:top;}
.tbl tr td:first-child{font-weight:800;color:var(--ink);white-space:nowrap;}
.tbl td em{color:var(--accent);font-weight:800;}
.tblnote{font-size:31px;color:var(--muted);font-weight:600;margin-top:32px;line-height:1.5;}
/* notecover — 지원사업 주간 릴스 표지. 카드뉴스 표지(_gen_notice.py)와 같은 형식으로
   맞춘 것이라 배경·그리드·알약·캐릭터 위치를 그쪽 CSS에서 그대로 가져왔다.
   테마 변수를 안 쓰고 색을 박아 두는 이유 = 카드와 픽셀로 같아야 하기 때문. */
.frame.notecover{background:linear-gradient(168deg,#FFFFFF 0%,#EAF2FF 62%,#DCEAFF 100%);}
.frame.notecover .body{justify-content:flex-end;}
.frame.notecover .top{color:#7B8AA3;font-size:28px;}
.frame.notecover .bot{color:#7B8AA3;font-size:28px;font-weight:700;}
.frame.notecover .bot .src{color:#9AA7BC;}
.cov-grid{position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(rgba(2,115,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(2,115,255,.05) 1px,transparent 1px);
  background-size:90px 90px;}
.cov-char{position:absolute;right:52px;top:250px;z-index:1;width:560px;}
.cov-char img{width:100%;display:block;}
.cov-k{display:inline-block;align-self:flex-start;font-size:32px;font-weight:800;color:#0273FF;
  background:rgba(2,115,255,.10);border:1px solid rgba(2,115,255,.22);
  border-radius:999px;padding:14px 28px;margin-bottom:40px;}
.cov-h{font-size:132px;font-weight:800;line-height:1.12;letter-spacing:-.04em;color:#0C1524;}
.cov-h em{color:#0273FF;}
.cov-sub{font-size:42px;font-weight:600;color:#4A5B75;margin-top:36px;line-height:1.5;}
.cov-cats{margin-top:48px;display:flex;flex-wrap:wrap;gap:16px;}
.cov-cats b{font-size:30px;font-weight:800;color:#2A3648;background:#fff;
  border:1px solid #D8E2F0;border-radius:14px;padding:14px 22px;box-shadow:0 2px 8px rgba(12,21,36,.05);}
.cov-hot{margin-top:42px;display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800;color:#0C1524;}
.cov-hot i{font-style:normal;background:#0273FF;color:#fff;border-radius:12px;padding:10px 18px;font-size:32px;}

  function fit(el){
    var maxH=parseFloat(el.dataset.fith)||640,
        maxF=parseFloat(el.dataset.fitmax)||150,
        minF=parseFloat(el.dataset.fitmin)||56,
        lo=minF, hi=maxF, best=minF;

  }
